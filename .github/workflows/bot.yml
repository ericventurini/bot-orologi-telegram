name: Bot Offerte Orologi

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pubblica-offerte:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica file del bot
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cerca e pubblica offerte orologi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: python bot_orologi.py

      - name: Salva elenco orologi già pubblicati
        run: |
          if [ -f pubblicati.json ]; then
            git config user.name "Bot Orologi"
            git config user.email "bot@users.noreply.github.com"
            git add pubblicati.json
            if ! git diff --staged --quiet; then
              git commit -m "Aggiornamento storico offerte orologi"
              git push
            fi
          fi
